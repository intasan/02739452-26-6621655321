x-airflow: &airflow
  image: apache/airflow:2.10.4
  user: "${AIRFLOW_UID:-50000}:0"
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    APP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PYTHONPATH: /opt/airflow/dags
    _PIP_ADDITIONAL_REQUIREMENTS: requests==2.32.3 beautifulsoup4==4.12.3 psycopg2-binary==2.9.10
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts:ro
    - ./evidence:/opt/airflow/evidence:ro
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  airflow-init:
    <<: *airflow
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/opt/airflow/scripts/airflow_init.sh"]
  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped
  airflow-webserver:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
  dashboard:
    image: python:3.11-slim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes: ["./web:/app:ro"]
    working_dir: /app
    command: sh -ec 'pip install --no-cache-dir -r requirements.txt; streamlit run app.py --server.address 0.0.0.0'
    ports: ["127.0.0.1:8501:8501"]
volumes:
  pgdata:
  airflow_logs:
